<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Streaming ASR Correction Prototype v6</title>
<style>
:root{
  color-scheme:light dark;
  --bg:Canvas;--fg:CanvasText;
  --panel:color-mix(in srgb,Canvas 94%,CanvasText 6%);
  --border:color-mix(in srgb,CanvasText 18%,transparent);
  --muted:color-mix(in srgb,CanvasText 58%,transparent);
  --blue:#2f7cff;--blue-bg:color-mix(in srgb,#2f7cff 18%,transparent);
  --hold:#d18a00;--hold-bg:color-mix(in srgb,#d18a00 22%,transparent);
  --red:#e03636;--red-bg:color-mix(in srgb,#e03636 25%,transparent);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif
}
.app{max-width:920px;margin:auto;padding:12px 12px 28px}
h1{font-size:1.22rem;margin:.3rem 0 .8rem}
.card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:12px;margin:10px 0
}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,input{font:inherit}
button{
  padding:9px 12px;border:1px solid var(--border);
  border-radius:10px;background:Canvas;color:CanvasText
}
button:disabled{opacity:.45}
input{
  min-width:0;padding:9px;border:1px solid var(--border);
  border-radius:9px;background:Canvas;color:CanvasText
}
#sourceWord{flex:1;min-width:10em}
.status,.small{font-size:.84rem;color:var(--muted)}
.stream{
  min-height:160px;margin-top:10px;padding:12px;
  border:1px solid var(--border);border-radius:10px;background:Canvas;
  line-height:2.15;font-size:1.14rem;white-space:pre-wrap;word-break:break-word
}
.final{display:inline}
.char{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:1.65em;height:1.65em;margin:0 .035em;
  border-radius:.38em;vertical-align:middle;user-select:none
}
.live{
  color:var(--blue);background:var(--blue-bg);
  border:1px solid color-mix(in srgb,var(--blue) 55%,transparent);
  cursor:pointer
}
.held{
  color:CanvasText;background:var(--hold-bg);
  border:1px solid color-mix(in srgb,var(--hold) 60%,transparent);
  cursor:pointer
}
.held.target{
  outline:2px solid var(--hold);outline-offset:2px;font-weight:800
}
.edited{
  color:CanvasText;background:var(--red-bg);
  border:1px solid color-mix(in srgb,var(--red) 72%,transparent);
  cursor:pointer;font-weight:800
}
.edited.target{
  outline:2px solid var(--red);outline-offset:2px
}
.queued{
  color:var(--blue);
  background:color-mix(in srgb,var(--blue) 10%,transparent);
  border-bottom:2px dotted color-mix(in srgb,var(--blue) 55%,transparent)
}
.box{
  margin-top:9px;padding:9px 10px;border:1px dashed var(--border);
  border-radius:9px;min-height:44px
}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.dot{
  display:inline-block;width:.8em;height:.8em;border-radius:3px;
  margin-right:.3em;vertical-align:-.05em
}
</style>
</head>
<body>
<div class="app">
  <h1>Streaming ASR Correction Prototype v6</h1>

  <section class="card">
    <div class="row">
      <button id="micBtn">🎙 開始辨識</button>
      <button id="clearBtn">清除</button>
      <span id="status" class="status">尚未啟動</span>
    </div>

    <div id="stream" class="stream"></div>

    <div class="legend small">
      <span><i class="dot" style="background:var(--blue-bg);border:1px solid var(--blue)"></i>藍：ASR provisional</span>
      <span><i class="dot" style="background:var(--hold-bg);border:1px solid var(--hold)"></i>橘：held，可繼續改</span>
      <span><i class="dot" style="background:var(--red-bg);border:1px solid var(--red)"></i>紅：已人工修改</span>
      <span>黑：已 commit</span>
    </div>

    <div id="holdInfo" class="box small">
      點藍字後，當下 provisional 段會進入 held buffer。
    </div>
  </section>

  <section class="card">
    <div class="row">
      <input id="sourceWord" value="證偽" placeholder="雙字詞，例如：證偽">
      <button id="takeA" disabled>AB → A</button>
      <button id="takeB" disabled>AB → B</button>
      <button id="undoThis" disabled>還原此字</button>
      <button id="cancelTarget" disabled>取消目前候選</button>
      <button id="undoAll" disabled>全部還原</button>
      <button id="commitNow" disabled>立即定稿</button>
    </div>
    <div id="correctionStatus" class="small" style="margin-top:8px">
      held 後可連續修改多個字；每次操作後都有 3 秒時間繼續修改。
    </div>
  </section>
</div>

<script>
(() => {
  const GRACE_MS = 3000;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const cps = s => [...(s || '')];

  const streamEl = document.getElementById('stream');
  const micBtn = document.getElementById('micBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const holdInfo = document.getElementById('holdInfo');
  const correctionStatus = document.getElementById('correctionStatus');
  const sourceWord = document.getElementById('sourceWord');
  const takeA = document.getElementById('takeA');
  const takeB = document.getElementById('takeB');
  const undoThis = document.getElementById('undoThis');
  const cancelTarget = document.getElementById('cancelTarget');
  const undoAll = document.getElementById('undoAll');
  const commitNow = document.getElementById('commitNow');

  let sessions = [];
  let currentSession = null;
  let nextSessionId = 1;

  // One held region; any number of edited chars inside it.
  // edits: Map<charIndex, replacement>
  let hold = null;
  let graceTimer = null;
  let graceDeadline = 0;

  let rec = null;
  let recState = 'idle';

  function setRecState(s){
    recState=s;
    micBtn.disabled=(s==='starting'||s==='stopping');
    micBtn.textContent=(s==='listening')?'⏹ 停止辨識':'🎙 開始辨識';
  }

  function getSession(id){ return sessions.find(s=>s.id===id); }
  function getResult(sessionId,resultIndex){
    return getSession(sessionId)?.results.get(resultIndex)||null;
  }

  // Approximate boundary recovery between the frozen snapshot and the
  // recognizer's later revised/extended hypothesis.
  function continuationAfter(snapshot, raw){
    const A=cps(snapshot), B=cps(raw);
    if(!A.length) return raw;
    if(raw.startsWith(snapshot)) return B.slice(A.length).join('');

    const m=A.length,n=B.length;
    let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);

    for(let i=1;i<=m;i++){
      cur[0]=i;
      for(let j=1;j<=n;j++){
        const cost=A[i-1]===B[j-1]?0:1;
        cur[j]=Math.min(
          prev[j]+1,
          cur[j-1]+1,
          prev[j-1]+cost
        );
      }
      [prev,cur]=[cur,prev];
    }

    let bestJ=Math.min(m,n), best=Infinity;
    for(let j=0;j<=n;j++){
      const score=prev[j]+0.08*Math.abs(j-m);
      if(score<best){best=score;bestJ=j;}
    }
    return B.slice(bestJ).join('');
  }

  function scheduleCommit(){
    if(!hold || hold.state!=='held') return;
    clearTimeout(graceTimer);
    graceDeadline=Date.now()+GRACE_MS;
    graceTimer=setTimeout(commitHeld,GRACE_MS);
    render();
  }

  function commitHeld(){
    if(!hold || hold.state!=='held') return;
    hold.targetIndex=null;
    hold.state='resolved';
    clearTimeout(graceTimer);
    graceDeadline=0;
    correctionStatus.textContent='held 區段已自動定稿。';
    render();
  }

  function makeChar(text,cls,title){
    const el=document.createElement('span');
    el.className='char '+cls;
    el.textContent=text;
    if(title) el.title=title;
    return el;
  }

  function renderedHeldChars(){
    if(!hold) return [];
    const arr=cps(hold.snapshot);
    for(const [idx,repl] of hold.edits.entries()){
      if(idx>=0 && idx<arr.length) arr[idx]=repl;
    }
    return arr;
  }

  function selectHeldChar(index){
    if(!hold || hold.state!=='held') return;
    hold.targetIndex=index;

    const original=cps(hold.snapshot)[index]??'';
    const current=hold.edits.get(index)??original;

    correctionStatus.textContent=
      `目前候選：「${current}」；原 ASR：「${original}」。` +
      (hold.edits.has(index) ? '這個字已改過，可再改或按「還原此字」。' : '');

    scheduleCommit();
  }

  function createHold(sessionId,resultIndex,charIndex){
    if(hold?.state==='held') return;

    const r=getResult(sessionId,resultIndex);
    if(!r || r.isFinal) return;

    hold={
      sessionId,
      resultIndex,
      snapshot:r.text,
      targetIndex:charIndex,
      edits:new Map(),
      state:'held'
    };

    correctionStatus.textContent=
      `已建立 held buffer；目前候選：「${cps(r.text)[charIndex]??''}」。3 秒內可繼續改其他字。`;

    scheduleCommit();
  }

  function applyReplacement(ch){
    if(!hold || hold.state!=='held' || hold.targetIndex===null || !ch) return;

    const idx=hold.targetIndex;
    const original=cps(hold.snapshot)[idx]??'';
    hold.edits.set(idx,ch);

    correctionStatus.textContent=
      `已標記「${original}」→「${ch}」。現在仍可直接點另一個橘/紅字繼續改；3 秒重新計時。`;

    hold.targetIndex=null;
    scheduleCommit();
  }

  function undoCurrentChar(){
    if(!hold || hold.state!=='held' || hold.targetIndex===null) return;

    const idx=hold.targetIndex;
    const original=cps(hold.snapshot)[idx]??'';

    if(hold.edits.has(idx)){
      const old=hold.edits.get(idx);
      hold.edits.delete(idx);
      correctionStatus.textContent=
        `已取消此字修改：「${old}」→ 回到原 ASR「${original}」。held 區仍保留。`;
    }else{
      correctionStatus.textContent='目前這個字沒有人工修改，不需要還原。';
    }

    hold.targetIndex=null;
    scheduleCommit();
  }

  function cancelCurrentTarget(){
    if(!hold || hold.state!=='held') return;
    hold.targetIndex=null;
    correctionStatus.textContent=
      '已取消目前候選；不改任何既有人工修改。held 區仍保留 3 秒，可再點其他字。';
    scheduleCommit();
  }

  function undoAllEdits(){
    if(!hold || hold.state!=='held') return;
    const count=hold.edits.size;
    hold.edits.clear();
    hold.targetIndex=null;
    correctionStatus.textContent=
      count ? `已全部還原 ${count} 個人工修改；held 區仍保留 3 秒。`
            : '目前沒有人工修改可還原；held 區仍保留。';
    scheduleCommit();
  }

  function renderNormalResult(session,idx,r){
    if(r.isFinal){
      const s=document.createElement('span');
      s.className='final';
      s.textContent=r.text;
      streamEl.appendChild(s);
      return;
    }

    cps(r.text).forEach((ch,i)=>{
      const b=makeChar(ch,'live','ASR provisional');
      if(!(hold?.state==='held')){
        b.onclick=()=>createHold(session.id,idx,i);
      }else{
        b.style.cursor='default';
        b.style.opacity='.72';
      }
      streamEl.appendChild(b);
    });
  }

  function renderHeldResult(session,idx,r){
    const same=hold && hold.sessionId===session.id && hold.resultIndex===idx;
    if(!same){
      renderNormalResult(session,idx,r);
      return;
    }

    if(hold.state==='resolved'){
      const s=document.createElement('span');
      s.className='final';
      s.textContent=renderedHeldChars().join('');
      streamEl.appendChild(s);

      const tail=continuationAfter(hold.snapshot,r.text);
      if(tail){
        if(r.isFinal){
          const t=document.createElement('span');
          t.className='final';
          t.textContent=tail;
          streamEl.appendChild(t);
        }else{
          cps(tail).forEach(ch=>{
            streamEl.appendChild(makeChar(ch,'live','new provisional continuation'));
          });
        }
      }
      return;
    }

    const original=cps(hold.snapshot);
    const shown=renderedHeldChars();

    shown.forEach((ch,i)=>{
      const edited=hold.edits.has(i);
      const selected=hold.targetIndex===i;

      const cls=(edited?'edited':'held')+(selected?' target':'');
      const b=makeChar(
        ch,
        cls,
        edited ? `人工修改；原 ASR：${original[i]}` : 'held，可點選'
      );
      b.onclick=()=>selectHeldChar(i);
      streamEl.appendChild(b);
    });

    const tail=continuationAfter(hold.snapshot,r.text);
    if(tail){
      cps(tail).forEach(ch=>{
        streamEl.appendChild(
          makeChar(ch,'queued','held 區之後的新 ASR；等待前段 commit')
        );
      });
    }
  }

  function render(){
    streamEl.replaceChildren();

    for(const session of sessions){
      const ids=[...session.results.keys()].sort((a,b)=>a-b);
      for(const idx of ids){
        renderHeldResult(session,idx,session.results.get(idx));
      }
    }

    const holding=hold?.state==='held';
    const hasTarget=holding && hold.targetIndex!==null;
    const targetEdited=hasTarget && hold.edits.has(hold.targetIndex);

    takeA.disabled=!hasTarget;
    takeB.disabled=!hasTarget;
    undoThis.disabled=!targetEdited;
    cancelTarget.disabled=!holding;
    undoAll.disabled=!(holding && hold.edits.size>0);
    commitNow.disabled=!holding;

    if(holding){
      const r=getResult(hold.sessionId,hold.resultIndex);
      const tail=continuationAfter(hold.snapshot,r?.text??'');
      const remain=Math.max(0,graceDeadline-Date.now());

      holdInfo.textContent=
        `held：「${renderedHeldChars().join('')}」；人工修改 ${hold.edits.size} 字` +
        (tail ? `；後續 ASR 排隊：「${tail}」` : '') +
        `；約 ${(remain/1000).toFixed(1)} 秒無操作後自動定稿。`;

    }else if(hold?.state==='resolved'){
      holdInfo.textContent='上一個 held 區已定稿；後續 ASR 繼續。';
    }else{
      holdInfo.textContent='點藍字後，當下 provisional 段會進入 held buffer。';
    }
  }

  setInterval(()=>{
    if(hold?.state==='held') render();
  },100);

  takeA.onclick=()=>{
    const a=cps(sourceWord.value);
    if(a[0]) applyReplacement(a[0]);
  };

  takeB.onclick=()=>{
    const a=cps(sourceWord.value);
    if(a[1]) applyReplacement(a[1]);
  };

  undoThis.onclick=undoCurrentChar;
  cancelTarget.onclick=cancelCurrentTarget;
  undoAll.onclick=undoAllEdits;
  commitNow.onclick=commitHeld;

  clearBtn.onclick=()=>{
    clearTimeout(graceTimer);
    sessions=[];
    currentSession=null;
    hold=null;
    graceDeadline=0;
    correctionStatus.textContent=
      'held 後可連續修改多個字；每次操作後都有 3 秒時間繼續修改。';
    render();
  };

  if(!SR){
    micBtn.disabled=true;
    statusEl.textContent='此瀏覽器沒有 SpeechRecognition API';
    render();
    return;
  }

  rec=new SR();
  rec.lang='zh-TW';
  rec.continuous=true;
  rec.interimResults=true;
  rec.maxAlternatives=3;

  rec.onstart=()=>{
    currentSession={id:nextSessionId++,results:new Map()};
    sessions.push(currentSession);
    setRecState('listening');
    statusEl.textContent='辨識中';
    render();
  };

  rec.onresult=e=>{
    if(!currentSession) return;

    for(let i=0;i<e.results.length;i++){
      const res=e.results[i];
      currentSession.results.set(i,{
        text:res[0].transcript,
        isFinal:res.isFinal,
        confidence:res[0].confidence
      });
    }

    render();
  };

  rec.onerror=e=>{
    statusEl.textContent=`錯誤：${e.error}`;
    setRecState('idle');
  };

  rec.onend=()=>{
    setRecState('idle');
    statusEl.textContent=hold?.state==='held'
      ? '辨識已停止；held buffer 仍保留。'
      : '已停止';
    currentSession=null;
    render();
  };

  micBtn.onclick=()=>{
    try{
      if(recState==='idle'){
        setRecState('starting');
        statusEl.textContent='啟動中…';
        rec.start();
      }else if(recState==='listening'){
        setRecState('stopping');
        statusEl.textContent='停止中…';
        rec.stop();
      }
    }catch(err){
      statusEl.textContent=String(err);
      setRecState('idle');
    }
  };

  render();
})();
</script>
</body>
</html>
